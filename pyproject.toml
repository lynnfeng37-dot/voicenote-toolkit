[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voicenote-toolkit"
version = "0.1.0.dev0"
description = "A correctable, traceable, and extensible speech-to-knowledge toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "VoiceNote contributors" }]
keywords = ["speech-to-text", "meeting-notes", "transcription", "audio"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "platformdirs>=4.2,<5",
  "structlog>=24.1,<26",
]

[project.optional-dependencies]
openai = ["openai>=1.50,<3"]
local-asr = ["faster-whisper>=1.0,<2"]
dev = [
  "mypy>=1.11,<2",
  "PyYAML>=6.0,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
voicenote = "voicenote.cli:app"

[project.urls]
Documentation = "https://github.com/lynnfeng37-dot/voicenote-toolkit"
Issues = "https://github.com/lynnfeng37-dot/voicenote-toolkit/issues"
Source = "https://github.com/lynnfeng37-dot/voicenote-toolkit"

[tool.hatch.build.targets.wheel]
packages = ["src/voicenote"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["voicenote"]

